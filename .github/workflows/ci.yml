name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck openssh-client

      - name: Check Bash syntax
        run: bash -n install.sh uninstall.sh bin/* tests/*.sh

      - name: Run ShellCheck
        run: shellcheck install.sh uninstall.sh bin/* tests/*.sh

      - name: Run tests
        shell: bash
        run: |
          if [[ "$EUID" -eq 0 ]]; then
            useradd --create-home --shell /bin/bash ci-runner
            runuser -u ci-runner -- bash "$GITHUB_WORKSPACE/tests/run.sh"
          else
            bash tests/run.sh
          fi
